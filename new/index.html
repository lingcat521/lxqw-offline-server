<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8">
    <title>旅行青蛙·中国之旅</title>
    <meta name="viewport" content="width=device-width,initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="full-screen" content="true" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="360-fullscreen" content="true" />
    <style>
        html,
        body {
            -ms-touch-action: none;
            background: #ffffff;
            padding: 0;
            border: 0;
            margin: 0;
            height: 100%;
        }
    </style>
</head>

<body>
    <div style="margin: auto;width: 100%;height: 100%;" class="egret-player" data-entry-class="Main" data-orientation="auto"
        data-scale-mode="fixedHeight" data-frame-rate="60" data-content-width="640" data-content-height="1136" data-show-paint-rect="false"
        data-multi-fingered="1" data-show-fps="false" data-show-log="false" data-show-fps-style="x:0,y:0,size:12,textColor:0xffffff,bgAlpha:0.9">
    </div>

    <script>
(function(){
  var EP="http://127.0.0.1:8088/__log";
  function post(msg){
    try{ var x=new XMLHttpRequest(); x.open("POST",EP,true); try{x.setRequestHeader("Content-Type","text/plain");}catch(e){} x.send(msg); return; }catch(e){}
    try{ if(window.fetch) fetch(EP,{method:"POST",mode:"no-cors",body:msg}); }catch(e){}
  }
  function send(kind,args){
    try{
      var parts=[];
      for(var i=0;i<args.length;i++){
        var a=args[i];
        try{ parts.push(a instanceof Error ? (a.message+" | "+(a.stack||"")) : (typeof a==="string"?a:JSON.stringify(a))); }catch(e){ parts.push(String(a)); }
      }
      var msg=kind+": "+parts.join(" ");
      if(msg.length>1500) msg=msg.slice(0,1500)+"...";
      post(msg);
    }catch(e){}
  }
  window.__lxqwLog=send;
  var ks=["log","warn","error","info","debug"];
  for(var i=0;i<ks.length;i++){(function(k){
    var o=(typeof console!=="undefined"&&console[k])?console[k]:null;
    var f=function(){ send(k,arguments); if(o){try{o.apply(console,arguments);}catch(e){}} };
    try{ if(typeof console!=="undefined") console[k]=f; }catch(e){}
  })(ks[i]);}
  try{ window.addEventListener("error",function(ev){ send("EXC",[(ev.message||"")+" @"+(ev.filename||"")+":"+(ev.lineno||"")]); }); }catch(e){}
  send("BOOT",["apk shim v12 installed"]);
})();
    </script>

    <script>
        window.gameLanguage="China";
        window.cdn = '';
        window.cdnLaunch = '';
        window.ossLaunch = '';
        var loadSingleScript = function (src, callback) {
            var s = document.createElement('script');
            s.async = false;
            s.src = src;
            s.addEventListener('load', function () {
                s.parentNode.removeChild(s);
                s.removeEventListener('load', arguments.callee, false);
                if (callback) callback();
            }, false);
            s.addEventListener('error', function () {
                console.log("loaderror");
                var label=document.createElement("label");
                label.style="color: red; position: absolute; top: 50%; left:50%;height: 100px; margin-top: -50px; margin-left: -150px;";
                label.innerText="网络加载失败,请检查网络设置重试.";
                document.body.appendChild(label);
            }, false);
            document.body.appendChild(s);
        };
        loadSingleScript("launcher.js"+"?="+Math.random());
    </script>
</body>

</html>
